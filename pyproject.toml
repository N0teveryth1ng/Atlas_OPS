# Project tooling config (audit D-1/D-2).
#
# The shipped application is the `atlas` package plus its test suite. The
# Playwright "auto-apply" scripts under `auto_applications/` and the standalone
# `resend_mail.py` are deliberately NOT part of the pipeline (see selfcheck
# checks A1/A2/A3: they are never imported and auto-apply is disabled). They are
# kept for reference only, so linting them is not part of the quality gate.

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "auto_applications|resend_mail\\.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["auto_applications", "resend_mail.py"]

[tool.mypy]
python_version = "3.11"
