# Atlas_OPS preferences — single source of truth for behaviour.
# Edit this file, not the code. Secrets stay in .env.

candidate:
  # Years of relevant professional experience. Fractions allowed.
  my_years_experience: 0
  # A role requiring up to (my_years + tolerance) is allowed. Fresher => 1.
  experience_tolerance: 1

targets:
  target_roles: []
  locations: []
  remote_ok: true
  employment_types: ["full-time", "internship"]
  # Minimum annual salary; null disables the check.
  salary_floor: null

companies:
  target_companies: []
  blacklist_companies: []

filters:
  # Skills the candidate completely lacks; a job requiring one is rejected.
  deal_breaker_skills: []
  # Ignore jobs older than this many days.
  max_job_age_days: 14
  # Reject jobs whose must-have skill coverage is below this fraction.
  must_have_coverage_floor: 0.6
  # Parses below this confidence are flagged for human review.
  min_parse_confidence: 0.5
  # Do not email jobs scoring below this.
  min_score_to_send: 60
  # At most this many jobs per digest.
  top_k: 10

models:
  extractor: "openai/gpt-oss-120b"
  evaluator: "openai/gpt-oss-120b"
  # Different model family from the evaluator, for adversarial independence.
  verifier: "qwen/qwen3.8-27b"
  temperature: 0.0

sources:
  # Query/search based feeds.
  remoteok: true
  remotive: true
  adzuna: true          # needs ADZUNA_APP_ID / ADZUNA_APP_KEY in .env
  # Target-company ATS boards (tokens live in companies.yaml).
  greenhouse: true
  lever: true
  ashby: true
  # Opt-in feeds. Off by default: check the terms note in README (Sources)
  # and the source's licence before enabling.
  himalayas: false      # public API, max 20/page, requires attribution
  adzuna_country: "in"
  results_per_page: 50

ranking:
  weights:
    fit_score: 0.50
    must_have_coverage: 0.30
    seniority_fit: 0.15
    preference_bonus: 0.05

decision:
  # Whole-profile vs whole-job decision engine. Weights MUST sum to 1.0.
  weights:
    skills_core: 0.30
    seniority_fit: 0.20
    role_fit: 0.15
    project_relevance: 0.15
    skills_secondary: 0.05
    education_fit: 0.05
    growth_fit: 0.05
    logistics_fit: 0.05
  # Conservative by default: a missed job is cheaper than a wrong application.
  apply_threshold: 80
  review_threshold: 65
  # Confidence gates: below c_min -> review; apply also needs >= c_apply.
  c_min: 0.5
  c_apply: 0.75
  # Veto floors.
  seniority_floor: 50
  coverage_floor: 0.6
  # Each JD red flag subtracts this many points, capped by max_risk_penalty.
  risk_penalty_per_flag: 10
  max_risk_penalty: 40
  # LLM-scored dimensions are sampled N times; spread above the limit lowers confidence.
  samples: 3
  spread_limit: 15
  margin_scale: 20

schedule:
  daily_hour: 9
