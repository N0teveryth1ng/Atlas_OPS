# Target companies polled directly through their public ATS job-board APIs.
# These are high-precision sources: jobs here are first-party, not aggregator
# reposts. Add or remove board tokens as you like.
#
# The token is the slug in the company's board URL, e.g.
#   https://boards.greenhouse.io/ACME        -> greenhouse: [acme]
#   https://jobs.lever.co/ACME               -> lever: [acme]
#   https://jobs.ashbyhq.com/ACME            -> ashby: [acme]
#   https://careers.smartrecruiters.com/X    -> smartrecruiters: [X]
#   https://apply.workable.com/X/            -> workable: [X]
#   https://X.recruitee.com/                 -> recruitee: [X]
#   https://X.teamtailor.com/jobs            -> teamtailor: [X]
#
# Every ATS collector is skipped entirely while its list is empty, so the
# committed template keeps all of them off until you fill one in.

companies:
  greenhouse: []
    # - stripe
    # - databricks
  lever: []
    # - netflix
  ashby: []
    # - openai
  smartrecruiters: []
    # - sportradar
  workable: []
    # - huckberry
  recruitee: []
    # - sysmex
  teamtailor: []
    # - varma